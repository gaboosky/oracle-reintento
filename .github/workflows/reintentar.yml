# Reintenta crear el servidor gratis de LiciGest en Oracle Cloud cada ~10 minutos, sin depender de
# tener una pestaña abierta. Va en el repositorio de GitHub en: .github/workflows/reintentar.yml
# Necesita estos secretos (Settings -> Secrets and variables -> Actions):
#   OCI_USER, OCI_FINGERPRINT, OCI_TENANCY, OCI_KEY (contenido del .pem), SSH_PUB (contenido del .pub),
#   OCI_SUBNET, OCI_IMAGE
# Cuando consigue el servidor, la ejecución termina "con error" a propósito para que GitHub te mande un
# correo. Después de eso, desactiva el flujo (Actions -> Reintentar servidor Oracle -> ... -> Disable).
name: Reintentar servidor Oracle

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  intentar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
      AD: 'jjXw:SA-SANTIAGO-1-AD-1'
    steps:
      - name: Instalar la herramienta de Oracle
        run: pip install --quiet oci-cli

      - name: Configurar acceso
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
        run: |
          mkdir -p ~/.oci
          # Sin retornos de carro de Windows y sin la línea "OCI_API_KEY" que Oracle agrega al final del .pem
          printf '%s\n' "$OCI_KEY" | tr -d '\r' | sed '/OCI_API_KEY/d' > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '%s\n' "$SSH_PUB" | tr -d '\r' > ~/.oci/ssh.pub
          limpio() { printf '%s' "$1" | tr -d '\r \n'; }
          {
            echo "[DEFAULT]"
            echo "user=$(limpio "$OCI_USER")"
            echo "fingerprint=$(limpio "$OCI_FINGERPRINT")"
            echo "tenancy=$(limpio "$OCI_TENANCY")"
            echo "region=sa-santiago-1"
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          echo "Revisión de los secretos:"
          [ -n "$(limpio "$OCI_USER")" ] && echo "  OCI_USER: ok" || echo "  OCI_USER: VACÍO"
          [ -n "$(limpio "$OCI_FINGERPRINT")" ] && echo "  OCI_FINGERPRINT: ok" || echo "  OCI_FINGERPRINT: VACÍO"
          [ -n "$(limpio "$OCI_TENANCY")" ] && echo "  OCI_TENANCY: ok" || echo "  OCI_TENANCY: VACÍO"
          head -1 ~/.oci/key.pem | grep -q 'BEGIN' && echo "  OCI_KEY: ok" || echo "  OCI_KEY: no empieza con -----BEGIN ... PRIVATE KEY-----"
          grep -q '^ssh-' ~/.oci/ssh.pub && echo "  SSH_PUB: ok" || echo "  SSH_PUB: no empieza con ssh-rsa"

      - name: Intentar crear el servidor
        env:
          COMP_S: ${{ secrets.OCI_TENANCY }}
          SUBNET_S: ${{ secrets.OCI_SUBNET }}
          IMG_S: ${{ secrets.OCI_IMAGE }}
        run: |
          limpio() { printf '%s' "$1" | tr -d '\r \n'; }
          COMP=$(limpio "$COMP_S"); SUBNET=$(limpio "$SUBNET_S"); IMG=$(limpio "$IMG_S")
          [ -z "$SUBNET" ] && echo "Falta el secreto OCI_SUBNET" && exit 1
          [ -z "$IMG" ] && echo "Falta el secreto OCI_IMAGE" && exit 1

          # ¿Ya existe? (para no crear dos)
          if ! YA=$(oci compute instance list -c "$COMP" --display-name licigest --all \
                 --query 'length(data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`])' \
                 --raw-output 2>/tmp/err); then
            echo "No pude consultar Oracle. Lo que respondió:"
            grep -v '^[[:space:]]*$' /tmp/err | head -8
            exit 1
          fi
          case "$YA" in
            ''|*[!0-9]*)
              echo "Respuesta rara al buscar el servidor: $YA"
              grep -v '^[[:space:]]*$' /tmp/err | head -8
              exit 1 ;;
          esac
          if [ "$YA" != "0" ]; then
            echo "El servidor licigest ya existe. Puedes desactivar este flujo."
            exit 0
          fi

          for CFG in '{"ocpus":2,"memoryInGBs":12}' '{"ocpus":1,"memoryInGBs":6}'; do
            SALIDA=$(oci compute instance launch -c "$COMP" --availability-domain "$AD" \
              --shape VM.Standard.A1.Flex --shape-config "$CFG" --image-id "$IMG" --subnet-id "$SUBNET" \
              --assign-public-ip true --display-name licigest --boot-volume-size-in-gbs 100 \
              --ssh-authorized-keys-file ~/.oci/ssh.pub 2>&1 || true)
            if echo "$SALIDA" | grep -q '"lifecycle-state"'; then
              echo "=============================================="
              echo " ¡SERVIDOR CREADO! ($CFG)"
              echo " Entra a Oracle -> Instancias -> licigest y copia la IP pública."
              echo "=============================================="
              exit 1   # a propósito: así GitHub te avisa por correo
            elif echo "$SALIDA" | grep -qi 'capacity'; then
              echo "$CFG: sin capacidad todavía"
            elif echo "$SALIDA" | grep -qi 'TooManyRequests'; then
              echo "$CFG: Oracle pide ir más lento; se reintenta en la próxima ejecución"
              exit 0
            else
              echo "$CFG: respuesta inesperada:"
              echo "$SALIDA" | grep -iE '"code"|"message"|Error' | head -6
            fi
            sleep 20
          done
